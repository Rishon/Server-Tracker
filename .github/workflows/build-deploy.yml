name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Client Dependencies
        working-directory: client
        run: bun install --frozen-lockfile

      - name: Build Client
        working-directory: client
        run: bun run build

      - name: Install Server Dependencies
        working-directory: server
        run: bun install --frozen-lockfile

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/github

            if [ ! -d "Server-Tracker" ]; then
              gh repo clone Rishon/Server-Tracker
            fi

            cd Server-Tracker
            git fetch origin master
            git reset --hard origin/master

            echo "FRONTEND_PORT=${{ secrets.FRONTEND_PORT }}" > client/.env
            echo "API_URL_INTERNAL=http://localhost:${{ secrets.BACKEND_PORT }}" >> client/.env

            echo "BACKEND_PORT=${{ secrets.BACKEND_PORT }}" > server/.env
            echo "MONGODB_URL=${{ secrets.MONGODB_URL }}" >> server/.env
            chmod 600 server/.env

            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image prune --force
